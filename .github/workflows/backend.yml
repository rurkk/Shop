name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - name: Verify and package
        run: ./backend/gradlew -p backend --no-daemon check bootJar
      - name: Start test stack
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml up --build --wait --wait-timeout 120
      - name: Exercise custom order via Nginx
        run: python3 infra/tests/smoke.py
      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml logs --tail 100
      - name: Stop test stack
        if: always()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml down --volumes
