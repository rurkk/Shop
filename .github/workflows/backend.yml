name: Shop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify and package
        run: ./backend/gradlew -p backend --no-daemon check bootJar
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start test stack
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml -f infra/tests/compose.yaml up --build --wait --wait-timeout 120
      - name: Exercise both order flows via Nginx
        run: python3 infra/tests/smoke.py
      - name: Publish storefront fixtures
        run: python3 infra/tests/seed_storefront.py
      - name: Exercise the storefront and both order flows in Chromium
        working-directory: frontend
        run: npm run test:e2e
      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml -f infra/tests/compose.yaml logs --tail 100
      - name: Stop test stack
        if: always()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml -f infra/tests/compose.yaml down --volumes
