services:
  backend:
    environment:
      SHOP_YOOKASSA_ENABLED: "true"
      SHOP_YOOKASSA_SHOP_ID: "12345"
      SHOP_YOOKASSA_SECRET_KEY: test-ci-key
      SHOP_YOOKASSA_API_BASE: http://payment-stub:8080/v3
      SHOP_SKETCH_GENAPI_ENABLED: "true"
      SHOP_SKETCH_GENAPI_API_KEY: local-sketch-test
      SHOP_SKETCH_GENAPI_TEST_STUB: "true"
    depends_on:
      payment-stub:
        condition: service_started
      sketch-stub:
        condition: service_started

  payment-stub:
    build:
      context: ./infra/tests
    ports:
      - "127.0.0.1:18081:8080"
    networks: [edge]

  sketch-stub:
    build:
      context: ./infra/tests
    command: ["python3", "/genapi_sketch_stub.py"]
    networks: [edge]
