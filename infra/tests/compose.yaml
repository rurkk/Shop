services:
  backend:
    environment:
      SHOP_YOOKASSA_ENABLED: "true"
      SHOP_YOOKASSA_SHOP_ID: "12345"
      SHOP_YOOKASSA_SECRET_KEY: test-ci-key
      SHOP_PUBLIC_ORIGIN: http://127.0.0.1:18080
      SHOP_YOOKASSA_API_BASE: http://payment-stub:8080/v3
    depends_on:
      payment-stub:
        condition: service_started

  payment-stub:
    build:
      context: ./infra/tests
    ports:
      - "127.0.0.1:18081:8080"
    networks: [edge]
