server_tokens off;
client_max_body_size 64k;
client_body_timeout 15s;
access_log /var/log/nginx/access.log shop;

resolver 127.0.0.11 valid=10s ipv6=off;
set $shop_backend http://backend:8080;

location ~ ^/api/orders/[^/]+/messages/stream$ {
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    gzip off;
    include /etc/nginx/proxy.conf;
}

location ~ ^/api/orders/[^/]+/files$ {
    client_max_body_size 11m;
    limit_conn shop_uploads 8;
    include /etc/nginx/proxy.conf;
}

location /api/ {
    limit_req zone=shop_code burst=8 nodelay;
    limit_req zone=shop_write burst=12 nodelay;
    limit_req zone=shop_csrf burst=60 nodelay;
    include /etc/nginx/proxy.conf;
}

location / {
    return 404;
}
