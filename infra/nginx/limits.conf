map $request_method:$uri $shop_code_limit {
    default "";
    ~^POST:/api/(orders/[^/]+|staff)/access/code$ $binary_remote_addr;
}

map $request_method:$uri $shop_write_limit {
    default "";
    ~^POST:/api/(orders/drafts|(orders/[^/]+|staff)/access/verify)$ $binary_remote_addr;
}

map $request_method:$uri $shop_csrf_limit {
    default "";
    ~^GET:/api/csrf$ $server_name;
}

limit_req_zone $shop_code_limit zone=shop_code:1m rate=6r/m;
limit_req_zone $shop_write_limit zone=shop_write:1m rate=30r/m;
limit_req_zone $shop_csrf_limit zone=shop_csrf:1m rate=120r/m;
limit_conn_zone $server_name zone=shop_uploads:1m;
limit_req_status 429;
limit_conn_status 429;

log_format shop '$remote_addr $request_method $status $body_bytes_sent $request_time';
