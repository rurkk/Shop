services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SHOP_SECURE_COOKIES: "false"
      SHOP_SMTP_HOST: mailpit
      SHOP_SMTP_PORT: "1025"
      SHOP_SMTP_AUTH: "false"
      SHOP_SMTP_STARTTLS: "false"
    depends_on:
      mailpit:
        condition: service_started

  nginx:
    build:
      context: ./infra/nginx
      target: local
    ports:
      - "127.0.0.1:${SHOP_LOCAL_PORT:-18080}:80"

  mailpit:
    image: axllent/mailpit:v1.29.0
    environment:
      MP_MAX_MESSAGES: "500"
    networks: [edge]
    ports:
      - "127.0.0.1:${SHOP_MAILPIT_PORT:-18025}:8025"
    mem_limit: 128m
