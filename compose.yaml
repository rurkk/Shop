name: embroidery-shop

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service
    image: shop-postgres:17-alpine
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${SHOP_DB_ADMIN_PASSWORD:?Set SHOP_DB_ADMIN_PASSWORD}
      SHOP_DB_USER: ${SHOP_DB_USER:?Set SHOP_DB_USER}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?Set SHOP_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=96MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$SHOP_DB_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    <<: *service
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-ip=storage", "-ip.bind=0.0.0.0", "-master.telemetry=false", "-webdav=false", "-admin.ui=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${SHOP_S3_ACCESS_KEY:?Set SHOP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SHOP_S3_SECRET_KEY:?Set SHOP_S3_SECRET_KEY}
      S3_BUCKET: ${SHOP_S3_BUCKET:?Set SHOP_S3_BUCKET}
      GOMEMLIMIT: 550MiB
    volumes:
      - storage-data:/data
    networks: [objects]
    mem_limit: 768m

  backend:
    <<: *service
    image: ${SHOP_BACKEND_IMAGE:-shop-backend:local}
    environment:
      SHOP_DB_URL: jdbc:postgresql://postgres:5432/shop
      SHOP_DB_USER: ${SHOP_DB_USER:?Set SHOP_DB_USER}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?Set SHOP_DB_PASSWORD}
      SHOP_S3_ENDPOINT: http://storage:8333
      SHOP_S3_BUCKET: ${SHOP_S3_BUCKET:?Set SHOP_S3_BUCKET}
      SHOP_S3_ACCESS_KEY: ${SHOP_S3_ACCESS_KEY:?Set SHOP_S3_ACCESS_KEY}
      SHOP_S3_SECRET_KEY: ${SHOP_S3_SECRET_KEY:?Set SHOP_S3_SECRET_KEY}
      SHOP_CODE_SECRET: ${SHOP_CODE_SECRET:?Set SHOP_CODE_SECRET}
      SHOP_STAFF_EMAILS: ${SHOP_STAFF_EMAILS:?Set SHOP_STAFF_EMAILS}
      SHOP_MAIL_FROM: ${SHOP_MAIL_FROM:?Set SHOP_MAIL_FROM}
      JAVA_TOOL_OPTIONS: "-Xmx384m -Djava.awt.headless=true -XX:+ExitOnOutOfMemoryError"
    networks: [edge, database, objects]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      start_period: 35s
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    <<: *service
    image: shop-nginx:local
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m

networks:
  edge:
  database:
    internal: true
  objects:
    internal: true

volumes:
  postgres-data:
  storage-data:
