services:
  backend:
    image: ${SHOP_BACKEND_IMAGE:?Set SHOP_BACKEND_IMAGE to the built backend image}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SHOP_SMTP_HOST: ${SHOP_SMTP_HOST:?Set SHOP_SMTP_HOST}
      SHOP_SMTP_PORT: ${SHOP_SMTP_PORT:-587}
      SHOP_SMTP_USERNAME: ${SHOP_SMTP_USERNAME:?Set SHOP_SMTP_USERNAME}
      SHOP_SMTP_PASSWORD: ${SHOP_SMTP_PASSWORD:?Set SHOP_SMTP_PASSWORD}
      SHOP_YOOKASSA_ENABLED: ${SHOP_YOOKASSA_ENABLED:-false}
      SHOP_YOOKASSA_SHOP_ID: ${SHOP_YOOKASSA_SHOP_ID:-}
      SHOP_YOOKASSA_SECRET_KEY: ${SHOP_YOOKASSA_SECRET_KEY:-}

  frontend:
    image: ${SHOP_FRONTEND_IMAGE:?Set SHOP_FRONTEND_IMAGE to the built frontend image}

  nginx:
    image: shop-nginx:production
    build:
      context: ./infra/nginx
      target: production
    environment:
      NGINX_ENVSUBST_FILTER: "^SHOP_DOMAIN$"
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN}
    volumes:
      - type: bind
        source: ${SHOP_TLS_DIR:?Set SHOP_TLS_DIR}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "80:80"
      - "443:443"
