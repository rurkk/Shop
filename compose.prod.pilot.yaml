services:
  nginx:
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if ! su nginx -s /bin/sh -c 'test -f /etc/nginx/pilot.htpasswd && test -r /etc/nginx/pilot.htpasswd && test -s /etc/nginx/pilot.htpasswd'; then
          echo 'The pilot password file must be nonempty and readable by nginx' >&2
          exit 1
        fi
        exec /docker-entrypoint.sh "$$@"
      - nginx-pilot
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - type: bind
        source: ./infra/nginx/pilot.conf
        target: /etc/nginx/pilot.d/access.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SHOP_PILOT_HTPASSWD:?Set SHOP_PILOT_HTPASSWD for the closed pilot}
        target: /etc/nginx/pilot.htpasswd
        read_only: true
        bind:
          create_host_path: false
